# New local metadata only; populate private environment and review deployment prerequisites.
name: viq-public-airflow
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: ${AIRFLOW_POSTGRES_PASSWORD:?Set a private Airflow PostgreSQL password}
      POSTGRES_DB: airflow
    volumes:
    - airflow_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U airflow -d airflow
      interval: 5s
      timeout: 5s
      retries: 20
    restart: 'no'
  airflow:
    build:
      context: .
      dockerfile: Dockerfile
    command: standalone
    ports:
    - ${VIQ_BIND_ADDRESS:-127.0.0.1}:8080:8080
    env_file:
    - ../../.env
    environment:
      AIRFLOW_HOME: /opt/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__PARALLELISM: '6'
      AIRFLOW__CORE__MAX_ACTIVE_TASKS_PER_DAG: '6'
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'true'
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_USERS: operator:admin
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: ${AIRFLOW_DATABASE_URL:?Set the private URL-encoded metadata DSN}
      PYTHONPATH: /opt/project
      PROJECT_ROOT: /opt/project
      KAFKA_BOOTSTRAP_SERVERS: host.docker.internal:29092
      MINIO_ENDPOINT: http://host.docker.internal:9000
      SPARK_MASTER: local[2]
      AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET:?Set a private Airflow JWT secret}
    volumes:
    - airflow_home:/opt/airflow
    - ./dags:/opt/airflow/dags:ro
    - airflow_logs:/opt/airflow/logs
    - ../../processing:/opt/project/processing:ro
    - ../../configs:/opt/project/configs:ro
    - ../../config:/opt/project/config:ro
    - ../../ingestion:/opt/project/ingestion:ro
    - ../../messaging:/opt/project/messaging:ro
    - ../../scripts:/opt/project/scripts:ro
    - ../../storage:/opt/project/storage:ro
    extra_hosts:
    - host.docker.internal:host-gateway
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'
volumes:
  airflow_home: null
  airflow_postgres_data: null
  airflow_logs: {}
