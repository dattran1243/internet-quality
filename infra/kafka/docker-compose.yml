# Single-broker local development; review cross-project networking before startup.
name: viq-public-kafka
services:
  kafka:
    image: apache/kafka:3.9.1
    ports:
    - ${VIQ_BIND_ADDRESS:-127.0.0.1}:9092:9092
    - ${VIQ_BIND_ADDRESS:-127.0.0.1}:29092:29092
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: HOST://:9092, DOCKER://:29092, INTERNAL://:39092, CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: HOST://localhost:9092, DOCKER://host.docker.internal:29092, INTERNAL://kafka:39092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT, HOST:PLAINTEXT, DOCKER:PLAINTEXT, INTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: DOCKER
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
    - kafka_data:/var/lib/kafka/data
    extra_hosts:
    - host.docker.internal:host-gateway
    healthcheck:
      test:
      - CMD-SHELL
      - /opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list > /dev/null 2>&1
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: 'no'
  bronze-consumer:
    build:
      context: ../..
      dockerfile: infra/kafka/Dockerfile.consumer
    env_file:
    - ../../.env
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:39092
      MINIO_ENDPOINT: http://host.docker.internal:9000
    extra_hosts:
    - host.docker.internal:host-gateway
    depends_on:
      kafka:
        condition: service_healthy
    restart: 'no'
volumes:
  kafka_data: null
